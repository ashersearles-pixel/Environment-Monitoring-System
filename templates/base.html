<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Environment Monitor - {% block title %}{% endblock title %}</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f8; color: #1f2937; }
    .page-wrapper { max-width: 1080px; margin: 0 auto; padding: 24px; }
    header.site-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
    header.site-header h1 { margin: 0; font-size: clamp(1.8rem, 2.5vw, 2.4rem); letter-spacing: -0.03em; }
    nav a { color: #2563eb; text-decoration: none; margin-right: 18px; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    .small-note { margin: 6px 0 0; color: #475569; font-size: 0.98rem; }
    main { background: #ffffff; border-radius: 20px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08); padding: 28px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin: 20px 0; }
    .status-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; padding: 20px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.04); }
    .status-card h3 { margin: 0 0 10px; font-size: 1rem; color: #334155; }
    .status-card p { margin: 8px 0; line-height: 1.6; color: #475569; }
    .status-card p strong { color: #111827; font-size: 1.3rem; }
    .section-title { margin: 0 0 12px; font-size: 1.1rem; color: #0f172a; }
    .form-block { display: grid; gap: 18px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .form-row label { min-width: 110px; color: #334155; font-weight: 600; }
    .form-row input { flex: 1; min-width: 180px; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; background: #ffffff; }
    .button { padding: 12px 18px; border: none; border-radius: 12px; background: #2563eb; color: #ffffff; font-weight: 700; cursor: pointer; transition: background 0.2s ease; }
    .button:hover { background: #1d4ed8; }
    .graph-image { max-width: 100%; border-radius: 16px; border: 1px solid #e2e8f0; display: block; margin-top: 14px; }
    footer { margin-top: 32px; text-align: center; color: #64748b; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div>
        <h1>Environment Monitor</h1>
        <p class="small-note">Live readings from temperature, humidity, and air quality sensors.</p>
      </div>
      <nav>
        <a href="{{ url_for('pages.home') }}">Home</a>
        <a href="{{ url_for('pages.about') }}">About</a>
      </nav>
    </header>
    <main>
      <section>
        <header>
          {% block header %}{% endblock header %}
        </header>
        {% block content %}<p>No messages.</p>{% endblock content %}
      </section>
    </main>
    <footer>Updated every 5 seconds. Simple and clean environmental monitoring.</footer>
  </div>
</body>
</html>
